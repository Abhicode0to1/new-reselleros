# ============================================================================
#  Phase 2 · Self-hosted Supabase data plane against Cloud SQL
# ----------------------------------------------------------------------------
#  Services: cloud-sql-proxy → (rest, auth, storage) ← caddy (TLS + routing)
#
#  The app's supabase-js client hits  https://api.anutech.in/{auth,rest,storage}/v1/*
#  Caddy terminates TLS and strips the /*/v1 prefix to each service. PostgREST
#  reads the JWT from Authorization: Bearer for role/RLS; the `apikey` header is
#  ignored (harmless) — RLS + the JWT are the real gate, exactly as on Supabase.
#
#  Cloud SQL auth: the proxy uses the VM's service account (Application Default
#  Credentials). The VM's service account MUST have the "Cloud SQL Client" role.
#  No key file needed on a GCE VM.
#
#  Bring up staged (see README): proxy → rest → auth → storage → caddy.
# ============================================================================

services:
  cloudsql-proxy:
    image: ${PROXY_IMAGE}
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_CONNECTION_NAME}"
    # Health: the proxy has no shell; downstream services just retry until it's up.
    expose:
      - "5432"

  rest:
    image: ${POSTGREST_IMAGE}
    restart: unless-stopped
    depends_on:
      - cloudsql-proxy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PW}@cloudsql-proxy:5432/${DB_NAME}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"

  auth:
    image: ${GOTRUE_IMAGE}
    restart: unless-stopped
    depends_on:
      - cloudsql-proxy
      - rest
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PW}@cloudsql-proxy:5432/${DB_NAME}?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
    expose:
      - "9999"

  storage:
    image: ${STORAGE_IMAGE}
    restart: unless-stopped
    depends_on:
      - cloudsql-proxy
      - rest
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${STORAGE_ADMIN_PW}@cloudsql-proxy:5432/${DB_NAME}
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: anutech
      REGION: asia-southeast1
      GLOBAL_S3_BUCKET: anutech-local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    expose:
      - "5000"

  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    depends_on:
      - rest
      - auth
      - storage
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  storage-data:
  caddy-data:
  caddy-config:
