# Build the app image for a TEST deployment — Cloud Run app, Supabase on a VM.
#
# ─── WHY A SEPARATE CONFIG ──────────────────────────────────────────────────
# `NEXT_PUBLIC_*` values are compiled into the browser bundle at build time, so a test
# deployment cannot be made by changing a runtime environment variable — it needs its own
# build, pointed at its own data plane. The Dockerfile's defaults stay production's; this
# file overrides them, and nothing here touches the production image.
#
# ─── AND WHY NOT BUILD ON THE VM ────────────────────────────────────────────
# The first attempt built on the test VM: 2 vCPUs, competing with ten Supabase
# containers, ~6 minutes, and one outright out-of-memory failure at Node's default 2 GB
# heap. Cloud Build runs it on an 8-vCPU machine instead, and the VM goes back to doing
# the one job it should be doing.
#
# Usage (from the repo, as yourself — not from the VM):
#
#   gcloud builds submit --config cloudbuild.test.yaml \
#     --substitutions=_ANON_KEY=<test stack anon key>,_APP_URL=<cloud run url>
#
# _APP_URL is a chicken-and-egg on the very first run: the Cloud Run URL does not exist
# until the service is deployed. Deploy once with the default, then re-run this with the
# real URL — it is baked into email and notification links, so it has to be right.

substitutions:
  _REGION: asia-south1
  _REPO: resellerps
  _IMAGE_NAME: reselleros-test
  # The test stack's anon key, as a DEFAULT so nobody has to paste it on a command line.
  #
  # Twice now a JWT has arrived at the terminal with its middle replaced by bullet
  # characters — once corrupting .env.local (the app failed with "String contains non
  # ISO-8859-1 code point"), once corrupting a build. Something between the chat and the
  # shell redacts things shaped like secrets. A value that cannot survive copy-paste does
  # not belong on a command line.
  #
  # Safe to commit: this is the standard local-Supabase demo key, published in Supabase's
  # own docs and identical on every local install. It is public by design — RLS is what
  # protects the data. It is NOT a production key and must never become one.
  _ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
  # Where the deployed app lives. Wrong value = dead links in emails, nothing worse.
  # Cloud Run's URL is predictable — <service>-<project number>.<region>.run.app — so it
  # can be baked in on the FIRST build instead of deploying once with a placeholder and
  # rebuilding. Change it if the service or project changes.
  _APP_URL: "https://reselleros-test-1027476185726.asia-south1.run.app"
  _SUPABASE_URL: "https://test-api.anutech.in"

options:
  # 8 vCPU. The build is CPU-bound and this is the whole point of not using the VM.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
